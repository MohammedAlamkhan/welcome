<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Media for Lock Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1a237e;
            margin-bottom: 15px;
        }
        .description {
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: #4a5568;
        }
        #media-selection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .media-item {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .media-item.selected {
             border-color: #3949ab;
        }
        .media-item img, .media-item video {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }
        .checkbox-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none; /* Allow clicks to pass through */
        }
        .media-item.selected .checkbox-overlay {
            opacity: 1;
        }
        .checkmark {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.2s ease;
        }
        .media-item.selected .checkmark {
            transform: scale(1);
        }
        .checkmark::after {
            content: '\2713';
            font-size: 18px;
            color: #3949ab;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .name-input {
            width: calc(100% - 10px);
            padding: 5px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
        }
        .action-button {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .action-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="page-title">Select Media</h1>
        <p class="description" id="page-description">Choose the photos or videos you want to display on this lock screen.</p>
        <div id="media-selection">
            <!-- Media items will be injected here -->
        </div>
        <button id="saveButton" class="action-button">Save and View Lock Screen</button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const SERVER_URL = window.location.origin;
        const mediaSelectionContainer = document.getElementById('media-selection');
        const saveButton = document.getElementById('saveButton');
        const pageTitle = document.getElementById('page-title');

        const urlParams = new URLSearchParams(window.location.search);
        const lockId = urlParams.get('lock');
        if (!lockId) {
            mediaSelectionContainer.innerHTML = '<p>Invalid configuration.</p>';
            return;
        }

        const lockScreenConfig = {
            '1': { title: 'Full Screen Video', dest: './lock.html', storageKey: 'lock1_media' },
            '2': { title: 'Full Screen Photos', dest: './lock2.html', storageKey: 'lock2_media' },
            '3': { title: 'Welcome for New Joinee', dest: './lock3.html', storageKey: 'lock3_media' }
        };

        const config = lockScreenConfig[lockId];
        pageTitle.textContent = `Configure: ${config.title}`;

        let savedConfig = [];
        try {
            const response = await fetch(`${SERVER_URL}/load-lock-config/${lockId}`);
            if (response.ok) {
                savedConfig = await response.json();
            } else if (response.status === 404) {
                console.log('No existing configuration found for this lock screen.');
            } else {
                throw new Error(`Failed to load configuration: ${response.statusText}`);
            }
        } catch (error) {
            console.error('Error loading configuration:', error);
            // Continue without pre-selected items if loading fails
        }

        try {
            const response = await fetch(`${SERVER_URL}/media-files`);
            if (!response.ok) throw new Error('Failed to fetch media.');
            const availableFiles = await response.json();

            if (availableFiles.length > 0) {
                availableFiles.forEach(filename => {
                    const item = createMediaItem(filename, savedConfig);
                    mediaSelectionContainer.appendChild(item);
                });
            } else {
                mediaSelectionContainer.innerHTML = '<p>No media found. Please upload files in the Media Manager.</p>';
            }
        } catch (error) {
            console.error('Error fetching media:', error);
            mediaSelectionContainer.innerHTML = '<p>Could not load media files.</p>';
        }

        function createMediaItem(filename, currentConfig) {
            const isVideo = /\.(mp4|webm|ogg)$/i.test(filename);
            const itemDiv = document.createElement('div');
            itemDiv.className = 'media-item';
            itemDiv.dataset.filename = filename;

            const mediaElement = isVideo ? document.createElement('video') : document.createElement('img');
            mediaElement.src = `${SERVER_URL}/media/${filename}`;
            if(isVideo) mediaElement.muted = true;

            itemDiv.appendChild(mediaElement);
            itemDiv.appendChild(document.createElement('div')).className = 'checkbox-overlay';
            itemDiv.appendChild(document.createElement('div')).className = 'checkmark';

            let nameInput;
            let isSelected = false;

            if (lockId === '3') {
                nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'name-input';
                nameInput.placeholder = "Guest's Name";
                nameInput.addEventListener('click', (e) => e.stopPropagation()); // Prevent click from bubbling to the item
                itemDiv.appendChild(nameInput);

                const savedItem = currentConfig.find(item => item.image === filename);
                if (savedItem) {
                    isSelected = true;
                    nameInput.value = savedItem.name || '';
                }
            } else {
                isSelected = currentConfig.includes(filename);
            }

            if (isSelected) {
                itemDiv.classList.add('selected');
            }

            itemDiv.addEventListener('click', () => {
                itemDiv.classList.toggle('selected');
            });

            return itemDiv;
        }

        saveButton.addEventListener('click', async () => {
            const selectedItems = [];
            const allItems = mediaSelectionContainer.querySelectorAll('.media-item.selected');

            allItems.forEach(item => {
                const filename = item.dataset.filename;
                if (lockId === '3') {
                    const name = item.querySelector('.name-input').value || 'Welcome!';
                    selectedItems.push({ image: filename, name: name });
                } else {
                    selectedItems.push(filename);
                }
            });

            if (selectedItems.length === 0) {
                alert('Please select at least one media file.');
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}/save-lock-config`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ lockId: lockId, configData: selectedItems })
                });

                if (!response.ok) throw new Error('Failed to save configuration.');
                
                alert('Configuration saved successfully!');
                window.location.href = config.dest;
            } catch (error) {
                console.error('Error saving configuration:', error);
                alert('Failed to save configuration. Please try again.');
            }
        });
    });
    </script>
</body>
</html>
