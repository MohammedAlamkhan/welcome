<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>People Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Nordique';
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow-x: hidden;
            /* Flat Design: Solid background */
            background-color: white;
            /* Dark solid background */
        }

        /* Header Styling */
        header {
            width: 100%;
            height: 40vh;
            background-image: url(asset/swirl.png);
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position-x: left;
            top: -3vh;
            left: -14vw;
        }

        .circle {
            width: 12vh;
            height: 12vh;
            background-color: rgb(244 3 20);
            border-radius: 50%;
            position: absolute;
            top: 9vh;
            right: 33vh;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: calc(100vh - 240px);
        }

        h1 {
            font-size: 4vh;
            font-weight: bolder;
            text-align: center;
            margin-bottom: 40px;
            /* Flat Design: Solid text color, no gradients/shadows */
            z-index: 99;
            color: #000032;
            letter-spacing: 2px;
            position: absolute;
            top: 24vh;
            letter-spacing: 2px;
            animation: fadeInDown 1s ease-out;
        }

        /* Carousel Container */
        #carousel {
            width: 30vh;
            text-align: center;
            /* Flat Design: Solid, slightly transparent background, flatter shadow */

            border-radius: 16px;
            position: absolute;
            top: 35vh;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 45vh;
            z-index: 99;
        }

        #carousel:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            /* Slightly enhanced hover shadow */
        }

        /* New: Inner container for carousel content for smoother transitions */
        .carousel-content {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .carousel-content.fade-out {
            opacity: 0;
            transform: translateY(20px);
        }


        /* Image Styling */
        .carousel-image {
            width: 30vh;
            height: 40vh;
            border-radius: 5%;
            object-fit: cover;
            /* Flat Design: Solid border, no box-shadow */
            border: 4px solid #6b7b8e;
            /* Solid border color */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            /* animation: imageSlideIn 0.8s ease-out; Removed as it's now handled by .carousel-content */
        }

        .carousel-image:hover {
            transform: scale(1.05);
            border-color: #92a4b8;
            /* Lighter border on hover */
        }

        /* Text Styling */
        .carousel-name {
            font-size: 3vh;
            font-weight: 600;
            margin-bottom: 15px;
            /* Flat Design: Solid text color */
            color: rgb(0 0 50);
            /* Light gray for name */
            /* animation: textSlideIn 0.8s ease-out 0.2s both; Removed as it's now handled by .carousel-content */
        }

        .carousel-details {
            font-size: 2vh;
            line-height: 1.6;
            /* Flat Design: Solid text color */
            color: rgb(0 0 50);
            /* Slightly darker light gray for details */
            font-weight: 300;
            /* animation: textSlideIn 0.8s ease-out 0.4s both; Removed as it's now handled by .carousel-content */
        }

        /* Loading State */
        .loading {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            animation: pulse 2s infinite;
        }

        /* Error State */
        .error {
            color: #ff6b6b;
            font-size: 1.1rem;
        }


        /* Footer Styling */
        footer {
            width: 100%;
            height: 5vh;
            position: relative;
            background-image: url(./asset/footer.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position-y: bottom;
            background-color: #0f102f;
            z-index: 99;
        }

        .rotating-semicircle {
            position: fixed;
            bottom: -25vh;
            left: 50%;
            transform: translateX(-50%);
            width: 60vh;
            height: 60vh;
            background-image: url("asset/mandala.png");
            background-size: contain;
            animation: rotateClockwise 40s linear infinite;
            transform-origin: center;
        }

        @keyframes rotateClockwise {
            from {
                transform: translateX(-50%) rotate(0deg);
            }
            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <header></header>

    <main>
        <div class="circle"></div>
        <h1>Welcome to <br>Momentum Services</h1>

        <div id="carousel">
            <div class="loading">Loading amazing people...</div>
        </div>

    </main>

    <footer></footer>
    <div class="rotating-semicircle"></div>
    <script>
        let currentIndex = 0;
        let people = [];
        let intervalId = null;
        let isTransitioning = false;

        function showPerson(index) {
            if (isTransitioning || index < 0 || index >= people.length) return;

            isTransitioning = true;
            currentIndex = index;
            const person = people[index];
            const carousel = document.getElementById('carousel');
            const currentContent = carousel.querySelector('.carousel-content');

            // If there's existing content, fade it out first
            if (currentContent) {
                currentContent.classList.add('fade-out');
                // Wait for fade-out transition to complete
                setTimeout(() => {
                    updateContent(carousel, person);
                    currentContent.classList.remove('fade-out'); // Ensure it's removed for next time
                }, 500); // Duration matches CSS transition
            } else {
                // If no content exists (first load), just update
                updateContent(carousel, person);
            }
        }

        function updateContent(carouselElement, personData) {
            carouselElement.innerHTML = `
    <div class="carousel-content">

      <h2 class="carousel-name">${personData.name}</h2>

      <p class="carousel-details">${personData.details}</p>
      <img src="${personData.image}" alt="${personData.name}" class="carousel-image" />
    </div>
  `;
            isTransitioning = false; // Reset transition flag after content is updated and new animation starts
        }

        function nextPerson() {
            const nextIndex = (currentIndex + 1) % people.length;
            showPerson(nextIndex);
        }

        function resetInterval() {
            if (intervalId) {
                clearInterval(intervalId);
            }
            intervalId = setInterval(nextPerson, 4000);
        }

        // Enhanced error handling for image loading
        function validateImageUrl(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Fetch and process data
        fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vTaXQgXOoKOMW5a0jB9LLICPts30NFI7HGHJTRgPQTwCvKCqzM_gB8CHmROzAok7XYtfzbCD8GBaobF/pubhtml')
            .then(res => res.text())
            .then(async html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const rows = Array.from(doc.querySelectorAll('table tbody tr')).slice(1);

                const tempPeople = [];

                for (const row of rows) {
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 3) {
                        const name = cells[0].textContent.trim();
                        const imgTag = cells[1].querySelector('img');
                        const imgSrc = imgTag ? imgTag.src : '';
                        const details = cells[2].textContent.trim();

                        if (imgSrc && name) {
                            // Validate image before adding
                            const isValidImage = await validateImageUrl(imgSrc);
                            if (isValidImage) {
                                tempPeople.push({ name, image: imgSrc, details });
                            }
                        }
                    }
                }

                people = tempPeople;

                if (people.length > 0) {
                    showPerson(0);
                    if (people.length > 1) {
                        resetInterval();
                    }
                } else {
                    document.getElementById('carousel').innerHTML = '<div class="error">No valid data found. Please check the data source.</div>';
                }
            })
            .catch(err => {
                console.error('Error loading data:', err);
                document.getElementById('carousel').innerHTML = '<div class="error">Failed to load data. Please try again later.</div>';
            });

        // Pause carousel on hover
        document.getElementById('carousel').addEventListener('mouseenter', () => {
            if (intervalId) {
                clearInterval(intervalId);
            }
        });

        document.getElementById('carousel').addEventListener('mouseleave', () => {
            if (people.length > 1) {
                resetInterval();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (isTransitioning) return;

            if (e.key === 'ArrowLeft') {
                const prevIndex = currentIndex === 0 ? people.length - 1 : currentIndex - 1;
                showPerson(prevIndex);
                resetInterval();
            } else if (e.key === 'ArrowRight') {
                nextPerson();
                resetInterval();
            }
        });
    </script>
</body>

</html>
