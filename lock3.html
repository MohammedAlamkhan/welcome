<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>People Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Nordique';
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow-x: hidden;
            /* Flat Design: Solid background */
            background-color: white;
            /* Dark solid background */
        }

        @font-face {
            font-family: 'nordique';
            src: url('./asset/nordique-pro-inline-demo.otf') format('opentype');
        }
        
        .custom-font {
            font-family: 'nordique', sans-serif;
        }

        /* Header Styling */
        header {
            width: 100%;
            height: 40vh;
            background-image: url(asset/swirl.png);
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position-x: left;
            top: -3vh;
            left: -14vw;
        }

        .circle {
            width: 12vh;
            height: 12vh;
            background-color: rgb(244 3 20);
            border-radius: 50%;
            position: absolute;
            top: 9vh;
            right: 33vh;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: calc(100vh - 240px);
        }

        h1 {
            font-size: 4vh;
            font-weight: bolder;
            text-align: center;
            margin-bottom: 40px;
            /* Flat Design: Solid text color, no gradients/shadows */
            z-index: 99;
            color: #000032;
            letter-spacing: 2px;
            position: absolute;
            top: 24vh;
            letter-spacing: 2px;
            animation: fadeInDown 1s ease-out;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Carousel Container */
        #carousel {
            width: 30vh;
            text-align: center;
            /* Flat Design: Solid, slightly transparent background, flatter shadow */

            border-radius: 16px;
            position: absolute;
            top: 35vh;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 45vh;
            z-index: 99;
        }

        #carousel:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            /* Slightly enhanced hover shadow */
        }

        /* New: Inner container for carousel content for smoother transitions */
        .carousel-content {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .carousel-content.fade-out {
            opacity: 0;
            transform: translateY(20px);
        }


        /* Image Styling */
        .carousel-image {
            width: 30vh;
            height: 40vh;
            border-radius: 5%;
            object-fit: cover;
            /* Flat Design: Solid border, no box-shadow */
            border: 4px solid #6b7b8e;
            /* Solid border color */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            /* animation: imageSlideIn 0.8s ease-out; Removed as it's now handled by .carousel-content */
        }

        .carousel-image:hover {
            transform: scale(1.05);
            border-color: #92a4b8;
            /* Lighter border on hover */
        }

        /* Text Styling */
        .carousel-name {
            font-size: 3vh;
            font-weight: 600;
            margin-bottom: 15px;
            /* Flat Design: Solid text color */
            
            color: #E11b22;
            /* Light gray for name */
            /* animation: textSlideIn 0.8s ease-out 0.2s both; Removed as it's now handled by .carousel-content */
        }

        .carousel-details {
            font-size: 2vh;
            line-height: 1.6;
            /* Flat Design: Solid text color */
            color: rgb(0 0 50);
            /* Slightly darker light gray for details */
            font-weight: 300;
            /* animation: textSlideIn 0.8s ease-out 0.4s both; Removed as it's now handled by .carousel-content */
        }

        /* Loading State */
        .loading {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            animation: pulse 2s infinite;
        }

        /* Error State */
        .error {
            color: #ff6b6b;
            font-size: 1.1rem;
        }


        /* Footer Styling */
        footer {
            width: 100%;
            height: 5vh;
            position: relative;
            background-image: url(./asset/footer.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position-y: bottom;
            background-color: #0f102f;
            z-index: 99;
        }

        .rotating-semicircle {
            position: fixed;
            bottom: -25vh;
            left: 50%;
            transform: translateX(-50%);
            width: 60vh;
            height: 60vh;
            background-image: url("asset/mandala.png");
            background-size: contain;
            animation: rotateClockwise 40s linear infinite;
            transform-origin: center;
        }

        @keyframes rotateClockwise {
            from {
                transform: translateX(-50%) rotate(0deg);
            }
            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <header></header>

    <main>
        <div class="circle"></div>
        <h1>Welcome to <br>Momentum Services</h1>

        <div id="carousel">
            <div class="loading">Loading...</div>
        </div>

    </main>

    <footer></footer>
    <div class="rotating-semicircle"></div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const carousel = document.getElementById('carousel');
            const SERVER_URL = window.location.origin;
            const lockId = '3'; // Corresponds to lock3.html
            let media = [];
            let currentIndex = 0;

            try {
                const response = await fetch(`${SERVER_URL}/load-lock-config/${lockId}`);
                if (response.ok) {
                    const fetchedConfig = await response.json();
                    // Map the fetched data to the expected structure
                    media = fetchedConfig.map(item => ({
                        name: item.name,
                        details: 'Welcome to the team!', // You can customize this
                        image: `${SERVER_URL}/media/${item.image}`
                    }));
                } else if (response.status === 404) {
                    console.log('No configuration found for lock screen 3. Using default.');
                } else {
                    console.error('Failed to load configuration:', response.statusText);
                }
            } catch (error) {
                console.error('Error fetching configuration:', error);
            }

            if (media.length === 0) {
                // Fallback to a default image if none are selected or loaded
                media.push({ 
                    name: 'Welcome!', 
                    details: 'We are excited to have you.', 
                    image: './asset/NewJoineeBg.jpg' 
                });
            }

            console.log('Loaded media for lock3:', media);

            function showPerson(index) {
                const person = media[index];
                console.log('Displaying person:', person);
                carousel.innerHTML = `
                    <div class="carousel-content">
                        <h2 class="carousel-name custom-font">${person.name}</h2>
                        <p class="carousel-details">${person.details}</p>
                        <img src="${person.image}" alt="${person.name}" class="carousel-image" />
                    </div>
                `;
            }

            function nextPerson() {
                currentIndex = (currentIndex + 1) % media.length;
                showPerson(currentIndex);
            }

            // Initial display
            showPerson(0);

            // Start slideshow if there is more than one item
            if (media.length > 1) {
                setInterval(nextPerson, 4000);
            }
        });
    </script>
</body>

</html>
