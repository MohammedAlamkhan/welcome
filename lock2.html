<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+CU:wght@100..400&display=swap" rel="stylesheet">
    <style>
        #lockscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            transition: transform 0.3s ease-out;
            overflow: hidden;
            display: flex; /* Added for centering error message */
            align-items: center; /* Added for centering error message */
            justify-content: center; /* Added for centering error message */
        }

        #bgImage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transform: translate(-50%, -50%);
            transition: opacity 1s ease-in-out;
        }

        #darkOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #content {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: #fff;
            transition: transform 0.3s ease-out;
        }

        .unlocked #lockscreen {
            transform: translateY(-100%);
        }

        .unlocked #content {
            transform: translateY(-100%);
        }

        #overlayText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e5e5e5;
            font-size: 3em;
            font-family: "Playwrite CU", cursive;
            font-optical-sizing: auto;
            font-weight: 1000;
            font-style: normal;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
            z-index: 2;
        }

        #arrow {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2em;
            color: white;
            z-index: 2;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            40% {
                transform: translateX(-50%) translateY(-15px);
            }

            60% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .error-message {
            color: white;
            font-size: 1.5em;
            text-align: center;
            z-index: 3; /* Ensure it's above overlay and image */
            position: relative; /* Allows z-index to work */
        }
    </style>
</head>

<body>
    <div id="lockscreen">
        <img id="bgImage" src="" alt="Background Image">
        <!-- <div id="darkOverlay"></div>
        <div id="overlayText">Momentum Services</div> -->
        <div id="arrow">^</div>
    </div>
    <div id="content">
        <!-- Your main content here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const bgImage = document.getElementById('bgImage');
            const SERVER_URL = window.location.origin;
            const lockId = '2'; // Corresponds to lock2.html
            let images = [];

            try {
                const response = await fetch(`${SERVER_URL}/load-lock-config/${lockId}`);
                if (response.ok) {
                    images = await response.json();
                } else if (response.status === 404) {
                    console.log('No configuration found for lock screen 2. Using default.');
                } else {
                    console.error('Failed to load configuration:', response.statusText);
                }
            } catch (error) {
                console.error('Error fetching configuration:', error);
            }

            if (images.length === 0) {
                // Fallback to a default image if none are selected or loaded
                images.push('asset/default_photo.jpg'); 
            }

            function setBackgroundImage(imageUrl) {
                const finalUrl = imageUrl.startsWith('http') || imageUrl.startsWith('asset') ? imageUrl : `${SERVER_URL}/media/${imageUrl}`;
                bgImage.style.opacity = 0;
                setTimeout(() => {
                    bgImage.src = finalUrl;
                    bgImage.style.opacity = 1;
                }, 500); // Fade transition
            }

            let currentImageIndex = 0;
            function switchImage() {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                setBackgroundImage(images[currentImageIndex]);
            }

            // Set the initial image
            setBackgroundImage(images[0]);

            // Start slideshow if there is more than one image
            if (images.length > 1) {
                setInterval(switchImage, 5000); // Switch every 5 seconds
            }
        });

        let isLocked = true;

        function hideLockscreen() {
            document.body.classList.add('unlocked');
            isLocked = false;
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }

        function handleUnlock(e) {
            if (isLocked) {
                hideLockscreen();
                e.preventDefault();
            }
        }

        document.addEventListener('click', handleUnlock);
        document.addEventListener('touchstart', handleUnlock);
    </script>
</body>

</html>
